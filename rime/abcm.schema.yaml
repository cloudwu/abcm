schema:
  schema_id: abcm
  name: 智能ABC · 改
  version: "0.1.0"
  author:
    - 云风 <cloudwu@gmail.com>
  description: |
    基于原 ABC 输入法的改版。

switches:
#  - name: full_shape
#    reset: 1
#    states: [ 半角, 全角 ]
  - name: simplification
    reset: 1
    states: [ 漢字, 汉字 ]

engine:
  processors:
    - key_binder
    - ascii_composer
    - lua_processor@*abcm_processor
    - punctuator
    - recognizer
    - selector
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*abcm_translator
    - punct_translator
  filters:
    - simplifier
    - lua_filter@*abcm_filter
    - uniquifier

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz12345678
  initials: abcdefghjklmnopqrstwxyz
  delimiter: "'"
  algebra:
    - xform/^zh/u/
    - xform/^ch/v/
    - xform/^sh/i/
    - abbrev/^([a-z]).+$/$1/
    - xform/^u/zh/
    - xform/^v/ch/
    - xform/^i/sh/

recognizer:
  import_preset: default 
  patterns:
    inumber: "^[iI][0-9gsbqweznyrjd$kmflteohpcuaix+*/-]+$"
    stroke: "^u[1-8]+$"
    ascii: "^v.+$"

punctuator:
  digit_separators: ",.:"
  half_shape:
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    '/' : [ ／, ÷ ]
    '?' : { commit: ？ }
    ';' : { commit: ； }
    ':' : { commit: ： }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '\' : [ 、, ＼ ]
    '|' : [ ·, ｜, '§', '¦' ]
    '`' : ｀
    '~' : ～
    '!' : { commit: ！ }
    '@' : ＠
    '#' : ＃
    '%' : [ ％, '°', '℃' ]
    '$' : [ ￥, '$', '£', '¥', '¢', '¤' ]
    '^' : { commit: …… }
    '&' : ＆
    '*' : [ ＊, ·, ×, ※ ]
    '(' : （
    ')' : ）
    '-' : －
    '_' : ——
    '+' : ＋
    '=' : ＝
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]

translator:
  dictionary: luna_pinyin
  enable_user_dict: true

simplifier:
  excluded_types:
    - inumber

key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
